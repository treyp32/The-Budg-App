<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Budg</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="The Budg"><meta name="theme-color" content="#2f6b3a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f4f6f3;--card:#fff;--tx:#1d2a21;--mu:#6b7a70;--ln:#dfe5df;--ac:#2f6b3a;--red:#c0392b;--bl:#909eae;--grn:#2e8b57;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121a15;--card:#1b261f;--tx:#e8efe9;--mu:#8fa196;--ln:#2a382e;--ac:#5fbf74}}
:root[data-theme=dark]{--bg:#121a15;--card:#1b261f;--tx:#e8efe9;--mu:#8fa196;--ln:#2a382e;--ac:#5fbf74}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 "Avenir Next",system-ui,sans-serif}
main{padding:14px 14px 90px;max-width:560px;margin:auto}h1{font-size:26px;margin:4px 0 8px;letter-spacing:-.5px}
.top{display:flex;justify-content:space-between;align-items:center}
select,input,button.b{font:inherit;background:var(--card);color:var(--tx);border:1px solid var(--ln);border-radius:10px;padding:7px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}
.score{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.sec{font-weight:700;margin-top:14px;color:var(--bl);text-transform:uppercase;font-size:12px;letter-spacing:.8px}.pill{padding:2px 8px;border-radius:8px;font-size:13px;font-weight:600;min-width:46px;text-align:center}
input.n{width:90px;text-align:right}
.bar{height:8px;border-radius:4px;background:rgba(144,158,174,.25);overflow:hidden;margin-top:4px}.sticky{border-color:var(--bl);position:sticky;top:0;z-index:5}.warn{background:hsla(40,90%,50%,.25);border-radius:10px;padding:8px 12px;margin:8px 0}.warn.r{background:hsla(5,60%,50%,.28)}.bar i{display:block;height:100%}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;color:var(--mu);font:600 12px inherit;padding:12px 0}nav .on{color:var(--ac)}
.seg{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.seg button{flex:1;padding:7px;border-radius:10px;border:1px solid var(--ln);background:var(--card);color:var(--tx);font:inherit}.seg .on{background:var(--ac);color:#fff;border-color:var(--ac)}
</style></head><body><main id="m"></main><nav id="n"></nav>
<script>
let D=null,S={},MS=[],st={t:"Dashboard",m:"",f:"all",o:"def",x:0,v:"rev",h:12},CFG={},tmr=0;try{CFG=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
function init(){S.a=S.a||{};S.b=S.b||{};S.t=S.t||[];S.rl=S.rl||[];S.lv=S.lv||{};S.g=S.g||{hg:125000,ct:'',ca:0,cs:0};MS=Object.keys(D.a);const c=mk(new Date());st.m=MS.includes(c)?c:MS[0];go()}
function setup(msg){m.innerHTML=`<h1>Connect</h1><div class=card><div class=mu>${msg||'Paste your Apps Script web app URL and your secret password. Stored only on this phone.'}</div><div class=row><input id=cu placeholder="Web app URL" style="width:100%"></div><div class=row><input id=ck type=password placeholder="Secret password" style="width:100%"></div><button class=b onclick="CFG={u:cu.value.trim(),k:ck.value};localStorage.setItem('cfg',JSON.stringify(CFG));boot()">Connect</button></div>`;n.innerHTML=''}
async function boot(){if(!CFG.u)return setup();m.innerHTML='<h1>Loading...</h1>';try{const r=await(await fetch(CFG.u+'?action=load&token='+encodeURIComponent(CFG.k))).json();if(r.err)return setup('Wrong password or URL. Try again.');D=r.d;S=r.state||{};try{localStorage.setItem('dc',JSON.stringify({D,S}))}catch(e){}}catch(e){const c=localStorage.getItem('dc');if(!c)return setup('Could not connect. Check the URL.');const o=JSON.parse(c);D=o.D;S=o.S}init()}
function push(){if(!CFG.u)return;fetch(CFG.u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.k,state:S})}).catch(()=>{})}
const save=()=>{S.u=new Date().toLocaleString();try{localStorage.setItem('dc',JSON.stringify({D,S}))}catch(e){}clearTimeout(tmr);tmr=setTimeout(push,1200)};
const mk=d=>{const x=new Date(d);return isNaN(x)?st.m:x.toLocaleString('en',{month:'short'})+'-'+String(x.getFullYear()).slice(2)};
const ci=nm=>D.c.findIndex(c=>c[0].toLowerCase().includes(nm.toLowerCase()));
const tx=(m,i)=>S.t.filter(t=>t.m==m&&t.c==i&&!t.tr&&!t.cl).reduce((s,t)=>s+t.a,0);
const A=m=>S.lv[m]?D.c.map((_,i)=>tx(m,i)):(S.a[m]||D.a[m]||D.c.map(_=>0)),B=m=>S.b[m]||D.b[m]||D.c.map(_=>0);
const $=v=>(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString(),pc=v=>Math.round(v*100)+'%',vr=(a,b)=>b?(a-b)/b:0;
function T(a){const r={i:0,f:0,a:0,d:0,s:0};D.c.forEach((c,i)=>r[c[1]]+=a[i]);r.ess=r.f+r.a;r.exp=r.ess+r.d;r.net=r.i-r.exp;r.cash=r.net-r.s;return r}
function score(m){const a=A(m),b=B(m);let n=0,d=0;D.c.forEach((c,i)=>{const w=c[2];if(!w)return;const v=vr(a[i],b[i]);d+=w;if(c[3])n+=v<0?w*(1+v):w;else n+=v<=0?w:v<.5?w*(1-2*v):0});return d?100*n/d:0}
const col=(v,g)=>{const x=Math.max(-1,Math.min(1,g*v*2));return `background:hsla(${x>0?145:5},55%,48%,${Math.abs(x)*.45})`};
const bc=(c,x)=>{if(c[1]=='f')return 'var(--bl)';const t=(c[3]||c[1]=='s')?Math.max(0,Math.min(1,(x-.5)/.5)):1-Math.max(0,Math.min(1,(x-.5)/.6));return `hsl(${Math.round(t*140)},60%,45%)`};
const brow=(l,a,b,c)=>{const x=b?a/b:0,k=bc(c,x);return `<div style="padding:7px 0;border-bottom:1px solid var(--ln)"><div class=row style="border:0;padding:0"><span>${l}</span><span><b style="color:${k}">${b?pc(x):'-'}</b> <span class=mu>${$(a)} of ${$(b)}</span></span></div><div class=bar><i style="width:${Math.max(0,Math.min(100,x*100))}%;background:${k}"></i></div></div>`};
const SN={i:'Income',f:'Fixed necessities',a:'Adjustable necessities',d:'Discretionary',s:'Saving + investing'};
const good=c=>c[3]||c[1]=='s'?1:-1;
function dash(){const m=st.m,a=A(m),b=B(m),t=T(a),bt=T(b),sc=score(m),pm=MS[MS.indexOf(m)-1],nwn=D.nw[m],nwp=D.nw[pm];
const ov=D.c.map((c,i)=>[c[0],c[1],a[i]-b[i],vr(a[i],b[i])]).filter(x=>'fad'.includes(x[1])&&x[2]>25&&x[3]>.1).sort((x,y)=>y[2]-x[2]);
const tk=[`Net income is ${$(t.net)} vs ${$(bt.net)} budgeted.`,ov.length?`Biggest overage: ${ov[0][0]} at ${$(ov[0][2])} over.`:'No category is more than 10% over budget.',t.exp>bt.exp?`Total spending is ${$(t.exp-bt.exp)} above plan.`:`Spending is ${$(bt.exp-t.exp)} under plan.`,t.cash<0?'Cash flow is negative this month.':`Cash flow is ${$(t.cash)} after saving and investing.`];
const wn=D.c.map((c,i)=>[c[0],c[1],a[i],b[i]]).filter(x=>'ad'.includes(x[1])&&x[3]>0&&x[2]/x[3]>=.8).map(x=>`<div class="warn ${x[2]>x[3]?'r':''}">${x[2]>x[3]?'Over budget':'Close to budget'}: ${x[0]} at ${pc(x[2]/x[3])}</div>`).join('');
const now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),fr=now.getDate()/dim,vb=D.c.reduce((s,c,i)=>'ad'.includes(c[1])?s+b[i]:s,0),va=D.c.reduce((s,c,i)=>'ad'.includes(c[1])?s+a[i]:s,0);
const pace=S.lv[m]&&mk(now)==m?`<div class=card><b>Pace</b><div class=row><span>Day ${now.getDate()} of ${dim}</span><span>on pace for ${$(va/fr)} of ${$(vb)}</span></div><div class=row><span>Safe to spend this month</span><b>${$(Math.max(0,vb-va))}</b></div></div>`:'';
const cl=S.lv[m]?`<button class=b onclick="if(confirm('Close ${m}? Totals lock in.')){S.a[m]=A(m);(S.cm=S.cm||{})[m]=1;S.t.forEach(t=>{if(t.m=='${m}')t.cl=1});delete S.lv[m];save();go()}">Close ${m}</button>`:'';
return wn+`<div class=card><div class=mu>Budget score</div><div class=score style="color:${sc>=75?'var(--grn)':sc>=60?'var(--tx)':'var(--red)'}">${Math.round(sc)}</div>
${nwn!=null?`<div class=row style="margin-top:8px"><span>Net worth</span><b>${$(nwn)} ${nwp!=null?`<span class=pill style="${col(nwn-nwp,1/2000)}">${$(nwn-nwp)} vs last month</span>`:''}</b></div>`:''}
<div class=mu><i>Last updated ${S.u||'not yet edited'}</i></div></div>
<div class=card>${brow('Income',t.i,bt.i,['','i',0,1])}${brow('Expenses',t.exp,bt.exp,['','d',0,0])}${brow('Net income',t.net,bt.net,['','i',0,1])}${brow('Cash flow',t.cash,bt.cash,['','i',0,1])}</div>
${pace}<div class=card><b>Key takeaways</b>${tk.map(x=>`<div class=row>${x}</div>`).join('')}</div>${cl}`}
function bud(){const m=st.m,b=B(m);let h=`<div class="card sticky"><div class=row><b>Net income</b><b id=ni></b></div><div class=row><b>After saving + investing</b><b id=na></b></div></div><div class=mu>Edit ${m}'s budget. Saves on this phone.</div><div class=seg><button class=on onclick="cp()">Copy ${m} to next month</button></div>`,s='';
D.c.forEach((c,i)=>{if(c[1]!=s){s=c[1];h+=`<div class=sec>${SN[s]}</div>`}h+=`<div class=row><span>${c[0]}<br><span class=mu>actual ${$(A(m)[i])}</span></span><input class=n inputmode=decimal value="${b[i]||''}" placeholder="0" onchange="sb(${i},this.value)"></div>`});setTimeout(nn,0);return h}
function nn(){if(!document.getElementById('ni'))return;const t=T(B(st.m));const c=v=>`<span class=pill style="${col(v,1/2000)}">${$(v)}</span>`;ni.innerHTML=c(t.net);na.innerHTML=c(t.cash)}
function sb(i,x){S.b[st.m]=[...B(st.m)];S.b[st.m][i]=parseFloat(x)||0;save();nn()}
function cp(){const nx=MS[MS.indexOf(st.m)+1];if(!nx)return;S.b[nx]=[...B(st.m)];save();st.m=nx;go()}
function mr(n,a){const k=n.toLowerCase();for(const r of S.rl)if(k.includes(r.k)&&(r.lo===''||a>=r.lo)&&(r.hi===''||a<r.hi))return r.c;return -1}
const isTr=n=>/payment|transfer|autopay|thank you|to savings|from savings|zelle to/i.test(n);
function cat(d,ap,a){const r=mr(d,a);if(r>=0)return r;const M={restaurants:'Food',groceries:'Grocer',shopping:'Fun',gas:'Gas',entertainment:'Fun',transportation:'Auto',health:'Medical',travel:'Travel',services:'Personal',other:'Misc',food:'Food'};return ci(M[(ap||'').toLowerCase()]||'zzz')}
const opts=(sel)=>D.c.map((c,i)=>'fad'.includes(c[1])||c[1]=='i'?`<option value=${i} ${i==sel?'selected':''}>${c[0]}</option>`:'').join('')
function txn(){const m=st.m,L=S.t.filter(t=>t.m==m&&(st.v!='rev'||t.rv)),nr=S.t.filter(t=>t.m==m&&t.rv).length;
const B_=(k,l)=>`<button class="${st.v==k?'on':''}" onclick="st.v='${k}';go()">${l}</button>`;
const add=`<div class=card><b>Add transaction</b><div class=row><input id=td type=date><input id=tm placeholder="Merchant" style="width:34%"><input id=ta class=n placeholder="$" inputmode=decimal></div><div class=row><select id=tc>${opts(-1)}</select><button class=b onclick="addT()">Add</button></div><div class=row><span class=mu>Apple Card CSV</span><input type=file accept=".csv" onchange="imp(this.files[0])"></div></div>`;
const hd=`<div class=seg>${B_('rev','Review ('+nr+')')}${B_('all','All')}${B_('rules','Rules')}</div>`;
if(st.v=='rules')return hd+`<div class=card><b>New rule</b><div class=row><input id=rk placeholder="Merchant contains" style="width:100%"></div><div class=row><input id=rlo class=n placeholder="min $"><input id=rhi class=n placeholder="under $"></div><div class=row><select id=rcat>${opts(-1)}</select><button class=b onclick="addR()">Add</button></div><div class=mu>Rules run top to bottom. Example: Costco under $10 first, then Costco.</div></div>`+S.rl.map((r,j)=>`<div class=card><div class=row><span>"${r.k}" ${r.lo!==''?'from '+$(r.lo):''} ${r.hi!==''?'under '+$(r.hi):''}<br><span class=mu>${D.c[r.c][0]}</span></span><span><button class=b onclick="mv(${j})">Up</button> <button class=b onclick="S.rl.splice(${j},1);save();go()">Delete</button></span></div></div>`).join('')+`<button class=b onclick="ap()">Apply rules to open transactions</button>`;
return hd+add+(nr&&st.v=='rev'?`<button class=b onclick="S.t.forEach(t=>{if(t.m=='${m}')t.rv=0});save();go()">Confirm all</button>`:'')+L.map(t=>{const j=S.t.indexOf(t);return `<div class=card><div class=row><b>${t.d||''} ${t.n}${t.tr?' <span class=pill style="background:var(--ln)">transfer</span>':''}</b><b>${$(t.a)}</b></div><div class=row><select onchange="rc(${j},this.value)"><option value=-1 ${t.tr?'selected':''}>Transfer (not spending)</option>${opts(t.c)}</select><span>${t.rv?`<button class=b onclick="S.t[${j}].rv=0;save();go()">OK</button> `:''}<button class=b onclick="sp(${j})">Split</button> <button class=b onclick="dl(${j})">Delete</button></span></div></div>`}).join('')}
function addR(){if(!rk.value)return;S.rl.push({k:rk.value.toLowerCase(),lo:rlo.value===''?'':+rlo.value,hi:rhi.value===''?'':+rhi.value,c:+rcat.value});save();go()}
function mv(j){if(j>0){[S.rl[j-1],S.rl[j]]=[S.rl[j],S.rl[j-1]];save();go()}}
function ap(){let k=0;S.t.forEach(t=>{if(t.cl||t.sp)return;const c=mr(t.n,t.a);if(c>=0&&c!=t.c){t.c=c;t.tr=0;k++}});save();alert(k+' updated');go()}
function addT(){const a=parseFloat(ta.value);if(!a)return;const m=mk(td.value||0);S.lv[m]=1;S.t.push({d:td.value,m,n:tm.value||"Manual",a,c:+tc.value});save();go()}
function rc(j,v){const t=S.t[j];if(+v<0){t.tr=1}else{t.tr=0;t.c=+v;S.rl.unshift({k:t.n.toLowerCase(),lo:"",hi:"",c:+v})}t.rv=0;save();go()}
function dl(j){S.t.splice(j,1);save();go()}
function sp(j){const t=S.t[j];let left=t.a;for(;;){const x=parseFloat(prompt("Amount to move to another category ("+$(left)+" left). Cancel when done."));if(!x||x>=left)break;const c=ci(prompt("Which category? (part of its name)")||"zzz");if(c<0){alert("No match");continue}left-=x;S.t.push({...t,a:x,c,sp:1,rv:0})}t.a=left;t.sp=1;save();go()}
function csv(s){const R=[];let r=[],f='',q=0;for(const ch of s+'\n'){if(ch=='"')q=!q;else if(ch==','&&!q){r.push(f);f=''}else if(ch=='\n'&&!q){r.push(f);R.push(r);r=[];f=''}else if(ch!='\r')f+=ch}return R}
function imp(file){const rd=new FileReader();rd.onload=()=>{const R=csv(rd.result),h=R[0].map(x=>x.trim().toLowerCase()),g=n=>h.findIndex(x=>x.startsWith(n));let k=0;
R.slice(1).forEach(r=>{const a=parseFloat(r[g('amount')]);if(!a||a<0||(r[g('type')]||'').toLowerCase().includes('payment'))return;const d=r[g('transaction date')],n=(r[g('merchant')]||r[g('description')]||'').trim(),c=cat(n,r[g('category')],a);
const dd=new Date(d),dk=isNaN(dd)?d:dd.toISOString().slice(0,10);if(S.t.some(t=>t.d==dk&&t.n==n&&Math.abs(t.a-a)<.005&&!t.sp))return;S.lv[mk(d)]=1;S.t.push({d:dk,m:mk(d),n,a,c:c<0?ci('Misc'):c,rv:1,tr:isTr(n)?1:0});k++});save();alert(k+' transactions imported');go()};rd.readAsText(file)}
function act(){const m=st.m,a=A(m),b=B(m);let rows=D.c.map((c,i)=>({c,i,a:a[i],b:b[i],v:vr(a[i],b[i])})).filter(r=>(r.a||r.b)&&(st.f=='all'||(st.f=='exp'?'fad'.includes(r.c[1]):st.f=='over'?r.v*-good(r.c)>0&&r.b:r.c[1]=='i')));
if(st.o=='var')rows.sort((x,y)=>y.v*-good(y.c)-x.v*-good(x.c));
const B_=(k,l)=>`<button class="${st.f==k?'on':''}" onclick="st.f='${k}';go()">${l}</button>`;
return `<div class=seg>${B_('all','All')}${B_('exp','Expenses')}${B_('inc','Income')}${B_('over','Off budget')}</div><div class=seg><button class="${st.o=='def'?'on':''}" onclick="st.o='def';go()">Sheet order</button><button class="${st.o=='var'?'on':''}" onclick="st.o='var';go()">Worst first</button></div>`+rows.map(r=>{const p=r.b?r.a/r.b:1,bad=r.v*-good(r.c)>0;return `<div class=card style="margin:6px 0">${brow(r.c[0],r.a,r.b,r.c)}</div>`}).join('')}
function mo(b,p,r){if(b<=0)return 0;if(!p)return null;if(!r)return Math.ceil(b/p);const i=r/1200,x=1-b*i/p;return x<=0?null:Math.ceil(-Math.log(x)/Math.log(1+i))}
const dt=n=>{if(n==null)return 'No payments set';const d=new Date(2026,9+n,1);return d.toLocaleString('en',{month:'short',year:'numeric'})+` (${Math.floor(n/12)}y ${n%12}m)`};
function fc(){const x=st.x;return `<div class=card><b>What if I pay/save more?</b><div class=row><span>Extra per month</span><b id=xv>$${x}</b></div><input type=range min=0 max=1000 step=25 value=${x} style="width:100%" oninput="st.x=+this.value;xv.textContent='$'+st.x;wf.innerHTML=wfv()">
<div id=wf>${wfv()}</div></div>
<div class=card><b>Savings goals</b>${G().map(g=>{const n=g[1]>=g[2]?0:g[3]?Math.ceil((g[2]-g[1])/g[3]):null;return `<div class=row><span>${g[0]}<br><span class=mu>${$(g[1])} of ${$(g[2])}</span></span><span>${n==null?'No transfers set':n?dt(n):'Reached'}</span></div><div class=bar><i style="width:${Math.min(100,g[1]/g[2]*100)}%;background:var(--ac)"></i></div>`}).join('')}</div>
${nwc()}`}
function nwv(){const N=D.nwm.length-1,h=Math.min(st.h,N),P=D.nwm.slice(0,h+1),W=300,H=130,mx=Math.max(...P.map(p=>p[1])),mn=Math.min(0,...P.map(p=>p[1])),X=i=>20+i*(W-40)/(h||1),Y=v=>H-18-(v-mn)/(mx-mn||1)*(H-40),k=Math.max(1,Math.ceil(h/5)),sp=h<=12?1:6;
const dots=h<=24,rows=P.map((p,i)=>[i,p]).filter(r=>r[0]>0&&(r[0]%sp==0||r[0]==h));
return `<svg viewBox="0 0 ${W} ${H}" style="width:100%"><polyline fill=none stroke=var(--ac) stroke-width=2.5 points="${P.map((p,i)=>X(i)+','+Y(p[1])).join(' ')}"/>${P.map((p,i)=>(dots?`<circle cx=${X(i)} cy=${Y(p[1])} r=2.5 fill=var(--ac) />`:'')+(i%k==0||i==h?`<text x=${X(i)} y=${H-4} font-size=8 text-anchor=middle fill=var(--mu)>${p[0]}</text>`:'')+(i==0||i==h?`<text x=${X(i)} y=${Y(p[1])-7} font-size=9 text-anchor=middle fill=var(--tx)>${$(p[1])}</text>`:'')).join('')}</svg>`+rows.map(r=>`<div class=row><span>${r[1][0]}</span><span><b>${$(r[1][1])}</b> <span class=pill style="${col(r[1][1]-P[0][1],1/4000)}">${$(r[1][1]-P[0][1])}</span></span></div>`).join('')}
function nwc(){const N=D.nwm.length-1,h=Math.min(st.h,N),ch=[[12,'12 mo'],[18,'1.5 yr'],[24,'2 yr'],[36,'3 yr'],[60,'5 yr'],[N,'Max']];
return `<div class=card><b>Net worth timeline</b><div class=seg>${ch.map(c=>`<button class="${h==c[0]?'on':''}" onclick="st.h=${c[0]};go()">${c[1]}</button>`).join('')}</div><div class=row><span class=mu>Months ahead</span><b id=nh>${h}</b></div><input type=range min=1 max=${N} value=${h} style="width:100%" oninput="st.h=+this.value;nh.textContent=st.h;nz.innerHTML=nwv()"><div id=nz>${nwv()}</div><div class=mu>Projected from your Budget Summary tab.</div></div>`}
function G(){return D.goal.map(g=>g[0]=='House fund'?[g[0],g[1],S.g.hg,g[3]]:g)}
function sg(k,v){S.g[k]=k=='ct'?v:parseFloat(v)||0;save();wf.innerHTML=wfv()}
function wfv(){const x=st.x,g=S.g,NM={Kelly:'Car Payment',Laine:'Debt to Laine'};
const L=(t,sub,a,b)=>`<div class=row><span>${t}<br><span class=mu>${sub}</span></span><span style="text-align:right">${b}<br><span class=mu>${a}</span></span></div>`;
const sv=(bal,goal,mn)=>bal>=goal?0:mn>0?Math.ceil((goal-bal)/mn):null,hs=D.goal.find(q=>q[0]=='House fund'),inp=(k,ph,w)=>`<input class=n style="width:${w||100}px" ${k=='ct'?'':'inputmode=decimal'} value="${g[k]||''}" placeholder="${ph}" onchange="sg('${k}',this.value)">`;
const hn=sv(hs[1],g.hg,hs[3]+x),ho=sv(hs[1],g.hg,hs[3]),cn=sv(g.cs,g.ca,x);
return D.debt.filter(d=>d[1]>0&&d[0]!='Credit card').map(d=>L(NM[d[0]]||d[0],`${$(d[1])} at ${$(d[2])}/mo`,'now '+dt(mo(d[1],d[2],d[3])),dt(mo(d[1],d[2]+x,d[3])))).join('')
+L('House fund',`${$(hs[1])} saved, ${$(hs[3])}/mo planned`,'now '+(ho==null?'no transfers set':dt(ho)),hn==null?'Move the slider':dt(hn))
+`<div class=row><span class=mu>House goal amount</span>${inp('hg','$',110)}</div><div class=sec>Custom goal</div><div class=row>${inp('ct','Title',150)}${inp('ca','Goal $')}</div><div class=row><span class=mu>Saved so far</span>${inp('cs','$')}</div>`
+(g.ca>0?`<div class=row><span>${g.ct||'Custom goal'}<br><span class=mu>${$(g.cs)} of ${$(g.ca)} at ${$(x)}/mo</span></span><b>${cn==null?'Move the slider':cn==0?'Reached':dt(cn)}</b></div>`:'')}
function go(){const V={Dashboard:dash,Actuals:act,Transactions:txn,Budget:bud,Forecast:fc}[st.t]();
m.innerHTML=`<div class=top><h1>${st.t}</h1>${st.t=='Forecast'?'':`<select onchange="st.m=this.value;go()">${MS.map(x=>`<option ${x==st.m?'selected':''}>${x}</option>`).join('')}</select>`}</div>`+V;
n.innerHTML=['Dashboard','Actuals','Transactions','Budget','Forecast'].map(t=>`<button class="${t==st.t?'on':''}" onclick="st.t='${t}';go()">${t=='Transactions'?'Txns':t}</button>`).join('')}
boot();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
