<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>The Budg</title>

<style>
:root{--bg:#c7d3c8;--card:#e9f0e9;--bd:#6f8574;--ln:#b4c3b6;--tx:#101c14;--mu:#35483b;--fld:#f9fbf9;--ac:#2a6336;--onac:#fff;--grn:#1e6b3d;--red:#a32d22;--bl:#4d5d70;--chipfg:#2b3744;--chipbg:#cad3d4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1511;--card:#2a3a2f;--bd:#7b9583;--ln:#3d5144;--tx:#f2f7f3;--mu:#b8c9bc;--fld:#16201a;--ac:#9bb0cc;--onac:#0a1320;--grn:#6fcf85;--red:#ff8a7a;--bl:#a3b0be;--chipfg:#d5dee8;--chipbg:#4e5d5b;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0f1511;--card:#2a3a2f;--bd:#7b9583;--ln:#3d5144;--tx:#f2f7f3;--mu:#b8c9bc;--fld:#16201a;--ac:#9bb0cc;--onac:#0a1320;--grn:#6fcf85;--red:#ff8a7a;--bl:#a3b0be;--chipfg:#d5dee8;--chipbg:#4e5d5b;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"Avenir Next",system-ui,sans-serif}
main{padding:14px 14px 96px;max-width:560px;margin:auto}h1{font-size:26px;margin:4px 0 8px;letter-spacing:-.5px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
input,select,button{font:inherit;height:44px;min-width:0;border-radius:10px;border:1px solid var(--bd);background:var(--fld);color:var(--tx);padding:0 10px}
input[type=range]{height:auto;padding:0;border:0;background:none;width:100%}input[type=checkbox]{height:22px;width:22px;padding:0}input::placeholder{color:var(--mu);opacity:1}option{background:var(--fld);color:var(--tx)}
button{font-weight:600;cursor:pointer;padding:0 12px}button.p,.seg button.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:10px 0}
.score{font-size:60px;font-weight:800;line-height:1;letter-spacing:-2px}.mu{color:var(--mu);font-size:13px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--ln)}.row:last-child{border:0}
.sec{font-weight:700;margin-top:14px;color:var(--bl);text-transform:uppercase;font-size:12px;letter-spacing:.8px}
.pill{padding:2px 8px;border-radius:8px;font-size:13px;font-weight:600;min-width:46px;text-align:center}
input.n{width:92px;text-align:right}.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:8px;background:var(--chipbg);color:var(--chipfg)}
.bar{height:8px;border-radius:4px;background:rgba(144,158,174,.3);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%}
.g{display:grid;gap:8px}.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.sticky{border-color:var(--bl);position:sticky;top:0;z-index:5}.warn{background:hsla(40,90%,50%,.25);border-radius:10px;padding:8px 12px;margin:8px 0}.warn.r{background:hsla(5,60%,50%,.28)}

nav button{flex:1;height:auto;border:0;background:none;color:var(--mu);font:600 11px inherit;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px}nav .on{color:var(--ac);background:none}
.sync-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:var(--chipbg);color:var(--chipfg);white-space:nowrap}.sync-pill.bad{background:hsla(5,60%,50%,.2);color:var(--red)}.sync-pill.busy{background:hsla(210,45%,55%,.18)}
.tw{display:grid;grid-template-columns:minmax(0,1fr) minmax(120px,.9fr);gap:12px}.lf{display:flex;flex-direction:column;justify-content:space-between;gap:12px}.rt{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}.lg{display:grid;gap:6px;font-size:11px;width:100%}.lg span{display:flex;align-items:center;gap:5px}.lg i{width:9px;height:9px;border-radius:3px;flex:none}.donut{width:100px;height:100px;border-radius:50%;position:relative;flex:none}.donut:after{content:"";position:absolute;inset:23px;background:var(--card);border-radius:50%;border:1px solid var(--ln)}.donut-label{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;font-size:10px;font-weight:800;text-align:center}.chart-bars{display:flex;align-items:flex-end;gap:6px;height:94px;margin:10px 0 2px}.chart-bars .bar-col{flex:1;min-width:0;text-align:center}.chart-bars .bar-fill{border-radius:5px 5px 2px 2px;min-height:3px}.chart-bars .bar-label{font-size:10px;color:var(--mu);white-space:nowrap}.muted-card{opacity:.62}.note-input{width:100%;height:36px;margin-top:6px;font-size:13px}.quickchips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.quickchips button{width:auto;height:32px;font-size:12px;padding:0 10px}.small{font-size:12px}.setting-label{font-size:12px;font-weight:700;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:12px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px}.balance-row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:4px 0}.trend-line{height:5px;background:var(--ln);border-radius:4px;overflow:hidden}.trend-line i{display:block;height:100%;background:var(--ac)}
.seg{display:flex;gap:6px;margin:6px 0;flex-wrap:wrap}.seg button{flex:1}
</style></head><body><main id="m"></main><nav id="n"></nav>
<script>
let D=null,S={},MS=[],st={t:"Dashboard",m:"",f:"all",o:"def",x:0,v:"rev",h:12},CFG={},tmr=0,SYNC_TEXT="Saved locally",SYNC_KIND="ok",THEME="auto";try{THEME=localStorage.getItem("budgTheme")||"auto";if(THEME!=="auto")document.documentElement.dataset.theme=THEME;else delete document.documentElement.dataset.theme}catch(e){}try{CFG=JSON.parse(localStorage.getItem('cfg')||'{}')}catch(e){}
let IB=[];
function mergeInbox(rows){rows.forEach(r=>{
 if(r.t==='error')return;
 if(r.t==='remove'){const i=S.t.findIndex(t=>t.pid===r.id&&t.pending);if(i>=0)S.t.splice(i,1);return}
 if(r.t!=='add')return;
 const postedMatch=r.pending_id?S.t.find(t=>t.pid===r.pending_id&&t.pending):null;
 if(postedMatch){postedMatch.d=String(r.d).slice(0,10);postedMatch.m=mk(postedMatch.d);postedMatch.n=r.n||postedMatch.n;postedMatch.a=Math.abs(+r.a||0);postedMatch.ac=r.ac||postedMatch.ac;postedMatch.pending=false;postedMatch.rv=1;postedMatch.pid=r.id;return}
 const same=S.t.find(t=>t.pid===r.id);
 if(same){
  if(same.pending){same.d=String(r.d).slice(0,10);same.m=mk(same.d);same.n=r.n||same.n;same.a=Math.abs(+r.a||0);same.ac=r.ac||same.ac;same.pending=!!r.pending;if(!r.pending)same.rv=1;}
  return;
 }
 const d=String(r.d).slice(0,10),inf=+r.a<0,a=Math.abs(+r.a||0),tr=isTr(r.n)||(inf&&r.ty==='credit');
 let c=inf&&!tr?ci('Trey Wages'):mr(r.n,a);if(c<0)c=ci('Misc');
 const rule=mro(r.n,a);
 S.t.push({d,m:mk(d),n:r.n,a,c,rv:rule&&rule.ok?0:1,tr:tr?1:0,pid:r.id,ac:r.ac,pending:!!r.pending,pending_id:r.pending_id||'',note:'',ig:false});
})}
async function refresh(){if(!await push())return;setSync('Refreshing bank transactions…','busy');try{const r=await(await fetch(CFG.u+'?action=sync&token='+encodeURIComponent(CFG.k))).json();if(r.err)throw Error(r.err);await boot(true)}catch(e){setSync('Not synced · retry','bad')}}
function init(){
 Object.assign(st,{q:st.q||'',fa:st.fa||'all',fc:st.fc||'all',sel:st.sel||0,ss:st.ss||[],sp:st.sp??null,sug:st.sug||null});
 S.a=S.a||{};S.b=S.b||{};S.t=S.t||[];S.rl=S.rl||[];S.lv=S.lv||{};S.g=S.g||{hg:125000,ct:'',ca:0,cs:0};S.amap=S.amap||{};
 MS=Object.keys(D.a||{});mergeInbox(IB);const c=mk(new Date());if(!st.m||!MS.includes(st.m))st.m=MS.includes(c)?c:MS[0];go()
}
function setup(msg){m.innerHTML=`<h1>Connect</h1><div class=card><div class=mu>${msg||'Paste your Apps Script web app URL and your secret password. Stored only on this phone.'}</div><div class=row><input id=cu placeholder="Web app URL" style="width:100%"></div><div class=row><input id=ck type=password placeholder="Secret password" style="width:100%"></div><button class=b onclick="CFG={u:cu.value.trim(),k:ck.value};localStorage.setItem('cfg',JSON.stringify(CFG));boot()">Connect</button></div>`;n.innerHTML=''}
async function boot(background=false){
 if(!CFG.u)return setup();
 let cache=null;try{cache=JSON.parse(localStorage.getItem('dc')||'null')}catch(e){}
 if(cache&&cache.D){D=cache.D;S=cache.S||{};init();setSync('Refreshing…','busy')}else m.innerHTML='<h1>Loading…</h1>';
 try{
  const r=await(await fetch(CFG.u+'?action=load&token='+encodeURIComponent(CFG.k))).json();
  if(r.err)throw Error(r.err);
  const localS=cache&&cache.S?cache.S:null,remoteS=r.state||{};
  const localStamp=localS?Date.parse(localS.u||'')||0:0,remoteStamp=Date.parse(remoteS.u||'')||0;
  const keepLocal=!!localS&&localStamp>remoteStamp;
  D=r.d;S=keepLocal?localS:remoteS;IB=r.inbox||[];
  try{localStorage.setItem('dc',JSON.stringify({D,S}))}catch(e){}
  init();
  if(keepLocal){setSync('Local changes pending','busy');setTimeout(push,800)}else setSync('Synced','ok');
  const errors=(IB||[]).filter(x=>x.t==='error');if(errors.length)setSync('Reconnect required','bad');
 }catch(e){
  if(!cache||!cache.D){setup('Could not connect. Check the URL and password.');return}
  if(!D)init();setSync('Offline · local data','bad');
 }
}
async function push(){
 if(!CFG.u){setSync('Saved on this device','bad');return false}
 setSync('Syncing…','busy');
 try{const r=await(await fetch(CFG.u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.k,state:S})})).json();if(r.err)throw Error(r.err);setSync('Synced','ok');return true}
 catch(e){setSync('Not synced · retry','bad');return false}
}
function setSync(s,k='ok'){SYNC_TEXT=s;SYNC_KIND=k;syncUi()}
function syncUi(){const e=document.getElementById('sync-status');if(e){e.className='sync-pill '+(SYNC_KIND||'');e.textContent=SYNC_TEXT}}
const save=()=>{S.u=new Date().toLocaleString();try{localStorage.setItem('dc',JSON.stringify({D,S}))}catch(e){}setSync('Saved locally · syncing…','busy');clearTimeout(tmr);tmr=setTimeout(push,1200)};
const mk=d=>{const x=typeof d=='string'&&/^\d{4}-\d\d-\d\d/.test(d)?new Date(+d.slice(0,4),+d.slice(5,7)-1,+d.slice(8,10)):new Date(d);return isNaN(x)?st.m:x.toLocaleString('en',{month:'short'})+'-'+String(x.getFullYear()).slice(2)};
const ci=nm=>D.c.findIndex(c=>c[0].toLowerCase().includes(nm.toLowerCase()));
const tx=(m,i)=>S.t.filter(t=>t.m==m&&t.c==i&&!t.tr&&!t.cl&&!t.ig).reduce((s,t)=>s+t.a,0);
const A=m=>S.lv[m]?D.c.map((_,i)=>tx(m,i)):(S.a[m]||D.a[m]||D.c.map(_=>0)),B=m=>S.b[m]||D.b[m]||D.c.map(_=>0);
const $=v=>(v<0?'-$':'$')+Math.abs(Math.round(v)).toLocaleString(),pc=v=>Math.round(v*100)+'%',vr=(a,b)=>b?(a-b)/b:0;
function T(a){const r={i:0,f:0,a:0,d:0,s:0};D.c.forEach((c,i)=>r[c[1]]+=a[i]);r.ess=r.f+r.a;r.exp=r.ess+r.d;r.net=r.i-r.exp;r.cash=r.net-r.s;return r}
function score(m){const a=A(m),b=B(m);let n=0,d=0;D.c.forEach((c,i)=>{const w=c[2];if(!w)return;const v=vr(a[i],b[i]);d+=w;if(c[3])n+=v<0?w*(1+v):w;else n+=v<=0?w:v<.5?w*(1-2*v):0});return d?100*n/d:0}
const col=(v,g)=>{const x=Math.max(-1,Math.min(1,g*v*2));return `background:hsla(${x>0?145:5},55%,48%,${Math.abs(x)*.45})`};
const bc=(c,x)=>{if(c[1]=='f')return 'var(--bl)';const t=(c[3]||c[1]=='s')?Math.max(0,Math.min(1,(x-.5)/.5)):1-Math.max(0,Math.min(1,(x-.5)/.6));return `hsl(${Math.round(t*140)},60%,45%)`};
const brow=(l,a,b,c)=>{const x=b?a/b:0,k=bc(c,x);return `<div style="padding:7px 0;border-bottom:1px solid var(--ln)"><div class=row style="border:0;padding:0"><span>${l}</span><span><b style="color:${k}">${b?pc(x):'-'}</b> <span class=mu>${$(a)} of ${$(b)}</span></span></div><div class=bar><i style="width:${Math.max(0,Math.min(100,x*100))}%;background:${k}"></i></div></div>`};
const SN={i:'Income',f:'Fixed necessities',a:'Adjustable necessities',d:'Discretionary',s:'Saving + investing'};
const good=c=>c[3]||c[1]=='s'?1:-1;
function dash(){
 const m=st.m,a=A(m),b=B(m),t=T(a),bt=T(b),sc=score(m),pm=MS[MS.indexOf(m)-1],nwn=(D.nw||{})[m],nwp=(D.nw||{})[pm],bs=balanceSheet(m);
 const ov=D.c.map((c,i)=>[c[0],c[1],a[i]-b[i],vr(a[i],b[i])]).filter(x=>'fad'.includes(x[1])&&x[2]>25&&x[3]>.1).sort((x,y)=>y[2]-x[2]);
 const tk=[`Net income is ${$(t.net)} vs ${$(bt.net)} budgeted.`,ov.length?`Biggest overage: ${ov[0][0]} at ${$(ov[0][2])} over.`:'No category is more than 10% over budget.',t.exp>bt.exp?`Total spending is ${$(t.exp-bt.exp)} above plan.`:`Spending is ${$(bt.exp-t.exp)} under plan.`,t.cash<0?'Cash flow is negative this month.':`Cash flow is ${$(t.cash)} after saving and investing.`];
 const wn=D.c.map((c,i)=>[c[0],c[1],a[i],b[i]]).filter(x=>'ad'.includes(x[1])&&x[3]>0&&x[2]/x[3]>=.8).map(x=>`<div class="warn ${x[2]>x[3]?'r':''}">${x[2]>x[3]?'Over budget':'Close to budget'}: ${x[0]} at ${pc(x[2]/x[3])}</div>`).join('');
 const now=new Date(),dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(),fr=now.getDate()/dim,vb=D.c.reduce((s,c,i)=>'ad'.includes(c[1])?s+b[i]:s,0),va=D.c.reduce((s,c,i)=>'ad'.includes(c[1])?s+a[i]:s,0);
 const pace=S.lv[m]&&mk(now)==m?`<div class=card><b>Pace</b><div class=row><span>Day ${now.getDate()} of ${dim}</span><span>on pace for ${$(va/fr)} of ${$(vb)}</span></div><div class=row><span>Safe to spend this month</span><b>${$(Math.max(0,vb-va))}</b></div></div>`:'';
 const close=S.lv[m]&&!S.cm?.[m]?`<button class=b onclick="if(confirm('Close ${m}? Totals will be saved to Main Page.')){S.a[m]=A(m);(S.cm=S.cm||{})[m]=1;S.t.forEach(t=>{if(t.m=='${m}')t.cl=1});delete S.lv[m];save();go()}">Close ${m}</button>`:'';
 const lastDay=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
 const reminder=mk(now)===m&&S.lv[m]&&lastDay-now.getDate()<=5&&!S.cm?.[m]?`<div class=warn>Month-end reminder: review your transactions and close ${m} when you're ready.</div>`:'';
 const assetsTotal=bs.investments+bs.cash+bs.vehicles,liabTotal=bs.liabilities.reduce((s,x)=>s+x.v,0);
 return `<div class="card"><div class=tw><div class=lf><div><div class=mu>Budget score</div><div class=score style="color:${sc>=75?'var(--grn)':sc>=60?'var(--tx)':'var(--red)'}">${Math.round(sc)}</div></div><div><div class=mu>Net worth</div><b style="font-size:24px">${$(bs.netWorth??nwn??0)}</b><div class=mu>${nwn!=null&&nwp!=null?`${$(nwn-nwp)} vs last month`:''}</div></div></div><div class=rt><div class=donut style="background:${donutGradient([[bs.investments,'#3f6aa8'],[bs.cash,'#1f7a55'],[bs.vehicles,'#b7791f']])}"><div class=donut-label>${$(assetsTotal)}<br>assets</div></div><div class=lg><span><i style="background:#3f6aa8"></i>Investments ${pc(assetsTotal?bs.investments/assetsTotal:0)} · ${$(bs.investments)}</span><span><i style="background:#1f7a55"></i>Cash ${pc(assetsTotal?bs.cash/assetsTotal:0)} · ${$(bs.cash)}</span><span><i style="background:#b7791f"></i>Other assets ${pc(assetsTotal?bs.vehicles/assetsTotal:0)} · ${$(bs.vehicles)}</span></div></div></div><div class=mu style="margin-top:10px;padding-top:8px;border-top:1px solid var(--ln)">Balance sheet from Main Page · ${S.u?'Updated '+S.u:'Awaiting sync'}</div><div class=setting-label>Liabilities</div>${bs.liabilities.map(x=>`<div class=balance-row><span>${x.n}</span><b>${$(x.v)}</b></div>`).join('')}<div class=balance-row style="border-top:1px solid var(--ln);padding-top:8px"><span>Total liabilities</span><b>${$(liabTotal)}</b></div></div>
 <div class=card><div class=row><b>Income</b><span><b>${$(t.i)}</b> <span class=mu>of ${$(bt.i)}</span> <span class=pill>${pc(bt.i?t.i/bt.i:0)}</span></span></div><div class=bar><i style="width:${Math.min(100,bt.i?Math.max(0,t.i/bt.i*100):0)}%;background:var(--grn)"></i></div><div class=row><b>Expenses</b><span><b>${$(t.exp)}</b> <span class=mu>of ${$(bt.exp)}</span></span></div><div class=bar><i style="width:${Math.min(100,bt.exp?Math.max(0,t.exp/bt.exp*100):0)}%;background:var(--red)"></i></div><div class=row><b>Net income</b><b>${$(t.net)}</b></div><div class=row><b>After saving + investing</b><b>${$(t.cash)}</b></div></div>
 ${pace}${wk()}${recurringCard()}${trendCard()}<div class=card><b>Key takeaways</b>${tk.map(x=>`<div class=row>${x}</div>`).join('')}</div>${reminder}${close}${wn?'<div class=sec>Warnings</div>'+wn:''}<button style="width:100%" onclick="st.t='Settings';go()">Settings & sync</button>`;
}
function bud(){
 const m=st.m,b=B(m);let h=`<div class="card sticky"><div class=row><b>Net income</b><b id=ni></b></div><div class=row><b>After saving + investing</b><b id=na></b></div></div><div class=mu>Edit ${m}'s budget. Changes save to your Google Sheet.</div><div class="two-col" style="margin-top:8px"><button onclick="cp()">Copy to next month</button><button onclick="cpall()">Apply to future months</button><button onclick="avg3()">Set from 3-month average</button><button onclick="downloadBackup()">Export backup</button></div>`,s='';
 D.c.forEach((c,i)=>{if(c[1]!==s){s=c[1];h+=`<div class=sec>${SN[s]}</div>`}h+=`<div class=row><span>${escHtml(c[0])}<br><span class=mu>actual ${$(A(m)[i])}</span></span><input class=n inputmode=decimal value="${b[i]||''}" placeholder="0" onchange="sb(${i},this.value)"></div>`});setTimeout(nn,0);return h
}
function nn(){if(!document.getElementById('ni'))return;const t=T(B(st.m));const c=v=>`<span class=pill style="${col(v,1/2000)}">${$(v)}</span>`;ni.innerHTML=c(t.net);na.innerHTML=c(t.cash)}
function sb(i,x){S.b[st.m]=[...B(st.m)];S.b[st.m][i]=parseFloat(x)||0;save();nn()}
function cp(){const nx=MS[MS.indexOf(st.m)+1];if(!nx)return alert('No next month is available in the loaded budget.');S.b[nx]=[...B(st.m)];save();st.m=nx;go()}
function cpall(){const ix=MS.indexOf(st.m);if(ix<0)return;MS.slice(ix+1).forEach(m=>S.b[m]=[...B(st.m)]);save();alert('Applied '+st.m+' budget to all future months currently loaded.');go()}
function avg3(){const ix=MS.indexOf(st.m),prev=MS.slice(Math.max(0,ix-3),ix);if(prev.length<1)return alert('No previous months are available.');S.b[st.m]=D.c.map((_,i)=>Math.round(prev.reduce((s,m)=>s+(+(S.lv[m]?tx(m,i):A(m)[i])||0),0)/prev.length*100)/100);save();go()}
function mro(n,a){const k=n.toLowerCase();return S.rl.find(r=>k.includes(r.k)&&(r.lo===''||a>=r.lo)&&(r.hi===''||a<r.hi))}
function mr(n,a){const r=mro(n,a);return r?r.c:-1}
