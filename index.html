function goalsList(){return allGoalPlans().map(g=>{const saved=(S.goalPlans||[]).some(x=>x.id===g.id),current=goalBalance(g),req=goalRequired(g),percent=Math.min(100,Math.max(0,current/Math.max(1,g.target)*100));return `<div class="goal-row"><div class="action-top"><div><b>${escHtml(g.name)}</b><div class="mu">Target ${escHtml(g.month||'Not set')} · ${$(current)} / ${$(g.target)}</div></div><button class="smallbtn" onclick="editGoal('${encodeURIComponent(g.id)}')">Edit</button></div><div class="bar"><i style="width:${percent}%;background:var(--ac)"></i></div><div class="row"><span>Monthly needed to reach goal</span><b>${$(req)}</b></div><div class="mu">${g.useAtTarget?`Planned fund use ${$2(g.useAmount||g.target)} in ${escHtml(g.month)} · `:''}${saved?'Custom goal':'Suggested from existing Forecast goals'} · Budget is unchanged until approved</div></div>`}).join('')||'<div class="mu">No goals yet. Add your first savings goal.</div>'}
function editGoal(enc){const id=enc?decodeURIComponent(enc):null,g=allGoalPlans().find(x=>x.id===id)||{id:'goal:'+Date.now(),name:'New goal',row:45,target:2000,month:'Jul-27',balance:0};openPanel('Savings goal',`<div class="field"><label>Goal name</label><input id="gName" value="${escAttr(g.name)}"></div><div class="field"><label>Target amount ($)</label><input id="gTarget" type="number" min="0" step=".01" value="${g.target}"></div><div class="field"><label>Target month (YYYY-MM)</label><input id="gMonth" type="month" value="${Math.floor(ym(g.month)/12)}-${String(ym(g.month)%12+1).padStart(2,'0')}"></div><div class="field"><label>Fund / savings budget category</label><select id="gRow">${[[44,'Emergency savings'],[45,'Baby Fund'],[46,'House Fund'],[47,'CPA Fund'],[48,'Investments']].map(([r,n])=>`<option value="${r}" ${g.row===r?'selected':''}>${n}</option>`).join('')}</select></div><label class="checkrow"><input type="checkbox" id="gUse" ${g.useAtTarget?'checked':''}> <span>Plan to use this fund at the target month</span></label><div class="field"><label>Expected amount to spend from fund ($)</label><input id="gUseAmount" type="number" min="0" step=".01" value="${g.useAmount??g.target}"></div><div class="field"><label>Expense category for planned spending</label><select id="gExpenseCat">${D.c.filter(c=>'fad'.includes(c[1])).map(c=>`<option ${g.expenseCategory===c[0]?'selected':''}>${escHtml(c[0])}</option>`).join('')}</select></div><label class="checkrow"><input type="checkbox" id="gAlready" ${g.alreadyBudgeted?'checked':''}> <span>This spending is already included in my future budget</span></label><div class="mu">For a new, unbudgeted purchase, the forecast can include the expense while paying it from the designated fund. If the expense is already budgeted or separately planned as an event, check the box to avoid duplication. Closed months remain unchanged.</div><div class="review-actions"><button class="p" onclick="saveGoal('${encodeURIComponent(g.id)}',true)">Pre function saveGoal(enc,preview){const id=decodeURIComponent(enc),name=document.getElementById('gName').value.trim(),amount=Number(document.getElementById('gTarget').value),month=document.getElementById('gMonth').value,row=+document.getElementById('gRow').value;if(!name||!Number.isFinite(amount)||amount<0||!/^[0-9]{4}-[0-9]{2}$/.test(month))return alert('Enter a name, valid target and target month.');const useAmount=Number(document.getElementById('gUseAmount').value),useAtTarget=document.getElementById('gUse').checked;if(!Number.isFinite(useAmount)||useAmount<0)return alert('Enter a valid planned fund use.');const goal={id,name,target:amount,month:fromYm(Number(month.slice(0,4))*12+ +month.slice(5)-1),row,useAtTarget,useAmount,expenseCategory:document.getElementById('gExpenseCat').value,alreadyBudgeted:document.getElementById('gAlready').checked};S.goalPlans=S.goalPlans||[];const j=S.goalPlans.findIndex(x=>x.id===id);if(j>=0)S.goalPlans[j]=goal;else S.goalPlans.push(goal);save();closePanel();if(preview)previewGoalBudget(id);else go();}
function previewGoalBudget(id){const goal=(S.goalPlans||[]).find(x=>x.id===id);if(!goal)return;const index=D.c.findIndex(c=>c[1]==='s'&&/emergency/i.test(c[0])&&goal.row===44||c[1]==='s'&&/baby/i.test(c[0])&&goal.row===45||c[1]==='s'&&/house/i.test(c[0])&&goal.row===46||c[1]==='s'&&/cpa/i.test(c[0])&&goal.row===47||c[1]==='s'&&/invest/i.test(c[0])&&goal.row===48);const needed=goalRequired(goal),targets=MS.filter(m=>ym(m)>planToday()&&ym(m)<=ym(goal.month)&&!S.cm?.[m]&&hasBudget(m));if(index<0)return alert('This goal has no matching savings category in your current spreadsheet. Goal saved, but no budget will be changed.');openPanel('Preview goal funding',`<p class="mu">${escHtml(goal.name)} · Required ${$2(needed)}/month. Contributions already planned are included; increases only apply where the existing budget is insufficient.</p><div class="row"><span>Target month</span><b>${goal.month}</b></div><div class="row"><span>Spreadsheet category</span><b>${escHtml(D.c[index][0])}</b></div>${targets.slice(0,12).map(m=>`<div class="row"><span>${m}</span><b>${$2(B(m)[index]||0)} → ${$2(Math.max(B(m)[index]||0,needed))}</b></div>`).join('')||'<div class="warn">No eligible future budget columns. The goal remains informational.</div>'}<div class="mu">No closed months or spreadsheet structure changes. A successful sync is still required to persist modifications to Budget.</div><button class="p" style="width:100%;margin-top:12px" onclick="applyGoalBudget('${encodeURIComponent(id)}')" ${targets.length?'':'disabled'}>Confirm budget changes</button>`)}
function applyGoalBudget(enc){const goal=(S.goalPlans||[]).find(x=>x.id===decodeURIComponent(enc));if(!goal)return;const index=D.c.findIndex(c=>c[1]==='s'&&(/emergency/i.test(c[0])&&goal.row===44||/baby/i.test(c[0])&&goal.row===45||/house/i.test(c[0])&&goal.row===46||/cpa/i.test(c[0])&&goal.row===47||/invest/i.test(c[0])&&goal.row===48));if(index<0)return;const n=goalRequired(goal),changes=[];MS.filter(m=>ym(m)>planToday()&&ym(m)<=ym(goal.month)&&!S.cm?.[m]&&hasBudget(m)).forEach(m=>{const b=[...B(m)],old=b[index];b[index]=Math.max(b[index],n);if(b[index]!==old){changes.push({m,i:index,old,value:b[index]});S.b[m]=b;}});S.planningAudit.push({type:'goal',at:timestampNow(),id:goal.id,changes});save();closePanel();go();alert('Budget changes saved locally and scheduled to sync. Check the sync status before relying on them.');}

const PLAN_PRESETS={baby:{name:'New child',categories:[['Medical Out of Pocket',2000,0],['Groceries',0,80],['Clothing',0,40],['Misc. Important',0,120]],incomeDelta:0},vehicle:{name:'Vehicle purchase',categories:[['Auto',5000,350],['Insurance',0,75]],incomeDelta:0},home:{name:'Home purchase',categories:[['Home',25000,0],['Utilities',0,120],['Insurance',0,150]],incomeDelta:0},school:{name:'School or career change',categories:[['CPA Expenses',2000,175]],incomeDelta:-600},custom:{name:'Custom event',categories:[['Misc. Important',0,0]],incomeDelta:0}};
function presetPlan(name){const preset=PLAN_PRESETS[name]||PLAN_PRESETS.custom;return {id:'event:'+Date.now(),type:name,name:preset.name,month:'Jul-27',fundSource:({baby:69,home:70,vehicle:67,school:67,custom:67})[name]||67,duration:0,incomeDelta:preset.incomeDelta,categories:preset.categories.map(([name,upfront,monthly])=>({name,upfront,monthly})),status:'sandbox'};}

function eventEditor(){const e=editEvent;if(!e)return;openPanel('Planned financial event',`<p class="mu">What-If Mode. Estimate costs and choose the budget categories affected. This does not change your real budget.</p><div class="field"><label>Event type (fills suggested amounts)</label><select id="evType" onchange="setEventPreset(this.value)">${[['baby','Child'],['vehicle','Vehicle'],['home','Home'],['school','School / career'],['custom','Custom']].map(([k,n])=>`<option value="${k}" ${e.type===k?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Event name</label><input id="evName" value="${escAttr(e.name)}"></div><div class="two-col"><div class="field"><label>Start month</label><input id="evMonth" type="month" value="${Math.floor(ym(e.month)/12)}-${String(ym(e.month)%12+1).padStart(2,'0')}"></div><div class="field"><label>Recurring duration</label><select id="evDuration">${[['0','Ongoing'],['6','6 months'],['12','12 months'],['24','2 years'],['60','5 years']].map(([v,n])=>`<option value="${v}" ${+e.duration===+v?'selected':''}>${n}</option>`).join('')}</select></div></div><div class="field"><label>Pay one-time expense from</label><select id="evFund">${[[67,'Available Cash / Checking'],[68,'Emergency Fund'],[69,'Baby Fund'],[70,'House Fund'],[71,'CPA Fund']].map(([r,n])=>`<option value="${r}" ${e.fundSource===r?'selected':''}>${n}</option>`).join('')}</select></div><div class="field"><label>Income change per month ($, negative if income falls)</label><input id="evIncome" type="number" step=".01" value="${e.incomeDelta||0}"></div><div class="sec">Expenses by category</div><div class="mu">The suggested costs are examples only. An asset purchase or down payment may require balance-sheet treatment rather than counting the entire cash payment as an expense.</div><div id="eventCategoryRows">${eventCategoryRows()}</div><button class="smallbtn" onclick="readEventEditor();editEvent.categories.push({name:'Misc. Important',upfront:0,monthly:0});eventEditor()">+ Add category</button><div class="review-actions"><button onclick="closePanel()">Cancel</button><button class="p" onclick="previewPlanEvent()">Preview impact</button></div>`)}
function eventCategoryRows(){const categories=(D.c||[]).filter(c=>'ifad'.includes(c[1]));return editEvent.categories.map((x,i)=>`<div class="event-category-row"><select aria-label="Expense category" id="evCat${i}">${categories.map(c=>`<option ${c[0]===x.name?'selected':''}>${escHtml(c[0])}</option>`).join('')}</select><input type="number" id="evOnce${i}" aria-label="One-time cost" placeholder="Upfront $" value="${+x.upfront||0}" step=".01"><input type="number" id="evMonthly${i}" aria-label="Recurring monthly cost" placeholder="Monthly $" value="${+x.monthly||0}" step=".01"><button class="smallbtn" aria-label="Remove event category" onclick="readEventEditor();editEvent.categories.splice(${i},1);eventEditor()">✕</button></div>`).join('')}
function readEventEditor(){if(!editEvent)return;const e=editEvent;e.name=document.getElementById('evName')?.value.trim()||e.name;const s=document.getElementById('evMonth')?.value;if(s&&/^\d{4}-\d{2}$/.test(s))e.month=fromYm((+s.slice(0,4))*12+(+s.slice(5)-1));e.duration=+document.getElementById('evDuration')?.value||0;e.fundSource=+document.getElementById('evFund')?.value||67;e.incomeDelta=+document.getElementById('evIncome')?.value||0;e.categories=e.categories.map((x,i)=>({name:document.getElementById('evCat'+i)?.value||x.name,upfront:+document.getElementById('evOnce'+i)?.value||0,monthly:+document.getElementById('evMonthly'+i)?.value||0}));}

function previewPlanEvent(){readEventEditor();const e=editEvent;if(!e||e.categories.some(x=>x.upfront<0||x.monthly<0)||ym(e.month)<=planToday())return alert('Choose a future month and nonnegative expense estimates.');st.whatIfEvent={...e,status:'sandbox'};closePanel();st.t='Overview';go();reviewPlanImpact()}
function planEventsList(){return [...(S.planEvents||[])].map(x=>`<div class="row"><span><b>${escHtml(x.name)}</b><br><span class="mu">${escHtml(x.month)} · ${x.status==='applied'?'Budget applied':'Saved what-if'}</span></span><button class="smallbtn" onclick="editPlanEvent('${encodeURIComponent(x.id)}')">Edit</button></div>`).join('')||'<div class="mu" style="margin-top:8px">No committed events. Use What-If to explore expenses before including them in your budget.</div>'}
function planChanges(event){const changes=[],issues=[];const targets=MS.filter(m=>hasBudget(m)&&ym(m)>=ym(event.month)&&!S.cm?.[m]&&ym(m)>planToday());for(const mon of targets){const offset=ym(mon)-ym(event.month),active=event.duration===0||offset<+event.duration;if(!active)continue;const b=B(mon),map=new Map();for(const cat of event.categories){const idx=D.c.findIndex(c=>c[0].toLowerCase()===String(cat.name).toLowerCase());if(idx<0){issues.push(cat.name+' not in spreadsheet');continue;}const delta=(offset===0?(+cat.upfront||0):0)+(+cat.monthly||0);if(delta)map.set(idx,(map.get(idx)||0)+delta);}const incomeIdx=D.c.findIndex(c=>c[1]==='i'&&/wages|salary|paycheck/i.test(c[0]));if(event.incomeDelta&&incomeIdx>=0)map.set(incomeIdx,(map.get(incomeIdx)||0)+(+event.incomeDelta));else if(event.incomeDelta)issues.push('No income category for income adjustment');for(const [i,delta] of map)changes.push({m:mon,i,old:+b[i]||0,new:(+b[i]||0)+delta,delta});}return {changes,issues};}
function reviewPlanImpact(){const e=st.whatIfEvent;if(!e)return alert('No active What-If event.');const totalUp=e.categories.reduce((n,x)=>n+(+x.upfront||0),0),rec=e.categories.reduce((n,x)=>n+(+x.monthly||0),0),p=planChanges(e);openPanel('Review What-If impact',`<div class="action-top"><div><b>${escHtml(e.name)}</b><div class="mu">${escHtml(e.month)} · Experimental plan</div></div><span class="chip">What-If</span></div><div class="row"><span>Upfront planned expenses</span><b>${$2(totalUp)}</b></div><div class="row"><span>Ongoing expense change</span><b>${$2(rec)} / month</b></div><div class="row"><span>Income adjustment</span><b>${$2(e.incomeDelta)} / month</b></div><div class="row"><span>One-time funding</span><b>${{67:'Available Cash',68:'Emergency Fund',69:'Baby Fund',70:'House Fund',71:'CPA Fund'}[e.fundSource]||'Available Cash'}</b></div><div class="row"><span>Net Income change / month</span><b>${$2((+e.incomeDelta||0)-rec)}</b></div><div class="sec">Category-by-category Budget preview</div>${p.changes.slice(0,20).map(x=>`<div class="row"><span>${x.m} · ${escHtml(D.c[x.i][0])}</span><b>${$2(x.old)} → ${$2(x.new)}</b></div>`).join('')||'<div class="mu">This event falls beyond currently loaded budget columns. A long-range What-If forecast is shown, but direct budget editing is unavailable for those dates.</div>'}${p.issues.length?`<div class="warn">${p.issues.map(escHtml).join('; ')}</div>`:''}<div class="mu">Your Main Page snapshots and closed months are read-only. Budget cells will only change if you confirm. Event costs are estimates; home/vehicle down payments need asset/liability modeling before committing.</div><div class="review-actions"><button onclick="savePlanSandbox()">Save as planned event</button><button class="p" onclick="applyPlanBudget()" ${p.changes.length?'':'disabled'}>Apply to Budget</button></div>`)}
function savePlanSandbox(){const x=st.whatIfEvent;if(!x)return;const e={...x,id:x.id,status:'sandbox'};const i=S.planEvents.findIndex(y=>y.id===e.id);if(i<0)S.planEvents.push(e);else S.planEvents[i]=e;st.whatIfEvent=null;save();closePanel();go()}
function applyPlanBudget(){const e=st.whatIfEvent;if(!e)return;const p=planChanges(e);if(!p.changes.length)return alert('No eligible future budget categories to update.');if(['home','vehicle'].includes(e.type))return alert('Home and vehicle purchases may create assets and liabilities. For safety, keep this as What-If until the balance-sheet treatment is modeled.');if(!confirm(`Apply ${p.changes.length} future category changes? Closed months are protected and an audit record will be saved.`))return;
 const affected=[...new Set(p.changes.map(x=>x.m))];for(const mon of affected){if(S.cm?.[mon]||ym(mon)<=planToday())return alert('Protected month cannot be edited.');const vals=[...B(mon)];p.changes.filter(x=>x.m===mon).forEach(x=>vals[x.i]=x.new);S.b[mon]=vals;}const applied={...e,status:'applied'};let at=S.planEvents.findIndex(x=>x.id===applied.id);if(at<0)S.planEvents.push(applied);else S.planEvents[at]=applied;S.planningAudit.push({type:'event',id:e.id,at:timestampNow(),changes:p.changes});st.whatIfEvent=null;save();closePanel();go();alert('Future budget changes saved locally. Verify sync status and compare affected budget months.');}

function budgyLiteAnswer(question){const q=question.toLowerCase().trim(),m=st.m,a=A(m),b=B(m),total=T(a),budget=T(b);if(/(how am i doing|how.*month|monthly summary|this month so far)/i.test(q))return `${m}: Income ${$2(total.i)}, expenses ${$2(total.exp)}, Net Income ${$2(total.net)}. ${reimbursementRows().filter(t=>reimbursementOutstanding(t)>0).length} open reimbursements; ${S.t.filter(t=>t.m===m&&(t.rv||t.pending)).length} transactions awaiting review. Calculated locally by Budgy Lite.`;if(/(grocer|food|rent|gas|how much.*spent|expense)/i.test(q)){const match=D.c.findIndex(c=>q.includes(c[0].toLowerCase())||c[0].toLowerCase().includes(q.replace(/.*\bon\s*/,'').replace(/\?.*/,'')));if(match>=0)return `${D.c[match][0]} (${m}): ${$2(a[match])} spent or received against a ${$2(b[match])} budget. Calculated from ${S.cm?.[m]?'closed spreadsheet actuals':'reviewed transactions'}.`;return `${m}: Income ${$2(total.i)}, expenses ${$2(total.exp)}, Net Income ${$2(total.net)}. Calculated from The Budg categories.`;}
 if(/(net worth|worth|assets)/i.test(q)){const v=balanceSheet(m).netWorth;return `${m} Net Worth: ${v==null?'unavailable':$2(v)}. ${v==null?'Check the Main Page snapshot.':'Based on your Main Page snapshot or forecast.'}`;}
 if(/(net income|saving|savings rate|50.?30.?20)/i.test(q)){const n=allocationTotals(m);return `${m}: Net Income / Savings ${$2(n.savings)}; Needs ${$2(n.needs)}; Wants ${$2(n.wants)}. Income ${$2(n.income)}. Targets: 50% / 30% / 20%. Calculated from your agreed fixed categories.`;}
 if(/(cash|balance|shortfall|low cash)/i.test(q)){const c=estimateAvailableCurrent();return `Available Cash (Checking + unrestricted savings): ${c==null?'not available from the current Main Page snapshot':$2(c)}. Low-cash threshold: $1,000. Designated savings funds excluded. Future balances are estimates.`;}
 if(/(reimburs|refund|owed)/i.test(q)){const open=reimbursementRows().filter(t=>reimbursementOutstanding(t)>.005);return `${open.length} reimbursements awaiting payment, totaling ${$2(open.reduce((n,t)=>n+reimbursementOutstanding(t),0))}. Open Transactions → Reimbursements to match refunds or write off unpaid balances.`;}
 if(/(over budget|budget warning)/i.test(q)){const rows=D.c.map((c,i)=>({name:c[0],over:(a[i]||0)-(b[i]||0)})).filter(x=>x.over>0).sort((x,y)=>y.over-x.over).slice(0,4);return rows.length?`${m} over-budget categories: ${rows.map(x=>`${x.name} ${$2(x.over)} over`).join('; ')}.`:'No categories are currently over budget among those tracked.';}
 if(/(card payment|payment due|upcoming payment)/i.test(q)){const pays=S.cardSchedule||[];return pays.length?`Scheduled card payments: ${pays.map(x=>x.name+' '+$2(x.amount)+' on day '+x.day).join('; ')}. Confirm amounts monthly.`:'No manual card payment schedules saved. Add them in Settings → Planning Assumptions / Credit Card Payments.';}
 return null;}
async function sendBudgy(){const f=document.getElementById('budgyInput'),question=f.value.trim();if(!question)return;f.value='';appendBudgy('user',question);const placeholder=appendBudgy('assistant','Calculating…'),btn=document.getElementById('budgySend');btn.disabled=true;const lite=budgyLiteAnswer(question);if(lite){placeholder.textContent='Budgy Lite · Calculated\n'+lite;budgyHistory.push({role:'user',text:question},{role:'assistant',text:lite});btn.disabled=false;return;}try{const m=st.m,a=A(m),b=B(m),summary={month:m,categories:D.c.map((c,i)=>({name:c[0],type:c[1],actual:a[i]||0,budget:b[i]||0})),accounts:effectiveAccounts().map(x=>({name:x.displayName,balance:x.effective,kind:accountKind(x)})),netCashChange:cashFlow(m),availableCash:estimateAvailableCurrent(),retirement:retirementAmounts(m),reimbursements:reimbursementRows().map(x=>({name:x.n,owed:reimbursementOutstanding(x)})),goals:allGoalPlans().map(x=>({name:x.name,target:x.target,date:x.month})),assumptions:planAssumptions()};const resp=await fetch(CFG.u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.k,action:'budgy',question,summary,history:budgyHistory.slice(-8)})});const data=await resp.json();if(data.err)throw Error(data.err);placeholder.textContent='Budgy AI · Gemini\n'+(data.reply||'No response available.');budgyHistory.push({role:'user',text:question},{role:'assistant',text:placeholder.textContent});}catch(err){placeholder.textContent='Budgy Lite can still answer spending, Net Income, cash, reimbursement, payment, and goal questions. AI is currently unavailable.';}finally{btn.disabled=false}}
function projectedCashChangeTile(mm){const data=projectedPoints(),i=data.findIndex(x=>x.mon===mm);if(i<1||data[i].cash==null||data[i-1].cash==null)return '<div class="card"><div class="tile-title">PROJECTED NET CASH CHANGE</div><div class="metric">—</div><div class="tile-small">Cash projections unavailable</div></div>';const change=data[i].cash-data[i-1].cash;return `<div class="card"><div class="tile-title">PROJECTED NET CASH CHANGE</div><div class="metric" style="color:${change>=0?'var(--grn)':'var(--red)'}">${$(change)}</div><div class="tile-small">Estimate · net income, planned transfers &amp; card payment timing</div></div>`;}
function cardPaymentReminder(){if(st.m!==currentMonth()||!(S.cardSchedule||[]).length)return '';const due=S.cardSchedule.filter(x=>x.startMonth&&ym(x.startMonth)<=planToday()&&x.confirmedMonth!==currentMonth());if(!due.length)return '';return `<div class="card"><div class="action-top"><div><b>Monthly card payment review</b><div class="mu">Confirm this month’s expected payments in Settings before relying on cash forecasts.</div></div><button class="smallbtn" onclick="st.t='Settings';go()">Review</button></div></div>`;}
function accountOrderList(){const order=S.accountOrder||[];return effectiveAccounts().slice().sort((a,b)=>{const ai=order.indexOf(a.id),bi=order.indexOf(b.id);return (ai<0?999:ai)-(bi<0?999:bi)||a.displayName.localeCompare(b.displayName)});}
function accountKind(a){const set=S.accountGroupOverrides?.[a.id];if(set&&['Cash & Savings','Investments','Credit Cards','Debt','Other Assets'].includes(set))return set;const row=+(S.rowmap||{})[a.id],name=(a.displayName||'').toLowerCase();if(row===85||/card|credit/.test(name))return 'Credit Cards';if([82,83,84].includes(row)||/debt|loan/.test(name))return 'Debt';if(row===61||row===62||/401|ira|invest|brokerage/.test(name))return 'Investments';if([66,67,68,69,70,71,72].includes(row)||/checking|saving|cash|fund/.test(name))return 'Cash & Savings';return 'Other Assets';}
function groupedAccountsHtml(rows){const groups=['Cash & Savings','Investments','Credit Cards','Debt','Other Assets'];const sorted=accountOrderList(),make=a=>`<div class="accountrow"><div><b>${escHtml(a.displayName)}</b><div class="mu">${a.source==='manual'?'Manual':'Plaid'} · ${S.rowmap?.[a.id]?'Row '+S.rowmap[a.id]:'Not mapped'}</div></div><div style="text-align:right"><b>${$2(a.effective||0)}</b>${a.override?`<div class="mu">Plaid: ${$2(a.reported||0)}</div>`:''}</div><button class="smallbtn" onclick="editAccount('${encodeURIComponent(a.id)}')">Edit</button></div>`;
 return groups.map(g=>{const list=sorted.filter(a=>accountKind(a)===g);if(!list.length)return '';const total=list.reduce((n,a)=>n+(+a.effective||0),0),funds=list.filter(a=>[68,69,70,71].includes(+S.rowmap?.[a.id])),primary=list.filter(a=>!funds.includes(a));return `<details class="account-group kind-${g.toLowerCase().replace(/[^a-z]+/g,'-')}" ${st.openGroups?.[g]?'open':''}><summary onclick="st.openGroups['${g}']=!this.parentNode.open"><b>${g}</b><strong>${$2(total)}</strong></summary>${primary.map(make).join('')}${funds.length?`<details class="funds-group" ${st.openGroups?.[g+' funds']?'open':''}><summary onclick="st.openGroups['${g} funds']=!this.parentNode.open"><b>Designated Savings Funds</b><strong>${$2(funds.reduce((n,x)=>n+(+x.effective||0),0))}</strong></summary>${funds.map(make).join('')}</details>`:''}</details>`}).join('');}
function manageAccountOrder(){const rows=accountOrderList();openPanel('Organize accounts',`<p class="mu">Arrange accounts and choose a display group. This does not modify their Plaid IDs, balances, or Main Page row mappings.</p>${rows.map((a,i)=>`<div class="account-organize"><div><b>${escHtml(a.displayName)}</b><div class="mu">${a.source==='manual'?'Manual':'Plaid'}</div></div><select id="groupSelect${i}" onchange="saveAccountGroup('${encodeURIComponent(a.id)}',this.value)">${['Cash & Savings','Investments','Credit Cards','Debt','Other Assets'].map(g=>`<option ${accountKind(a)===g?'selected':''}>${g}</option>`).join('')}</select><div class="sort-arrows"><button class="smallbtn" onclick="moveAccountOrder('${encodeURIComponent(a.id)}',-1)" aria-label="Move account up">↑</button><button class="smallbtn" onclick="moveAccountOrder('${encodeURIComponent(a.id)}',1)" aria-label="Move account down">↓</button></div></div>`).join('')}<button class="smallbtn" style="width:100%;margin-top:10px" onclick="S.accountGroupOverrides={};S.accountOrder=[];save();manageAccountOrder()">Reset grouping and order</button>`)}
function saveAccountGroup(enc,g){const id=decodeURIComponent(enc);S.accountGroupOverrides=S.accountGroupOverrides||{};S.accountGroupOverrides[id]=g;save();manageAccountOrder();}
function moveAccountOrder(enc,delta){const id=decodeURIComponent(enc),order=accountOrderList().map(x=>x.id),i=order.indexOf(id);if(i<0)return;const j=Math.max(0,Math.min(order.length-1,i+delta));[order[i],order[j]]=[order[j],order[i]];S.accountOrder=order;save();manageAccountOrder()}

boot();setInterval(()=>{if(D&&st.lastCalendarMonth&&st.lastCalendarMonth!==currentMonth())go()},60000);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
