function setChartRange(kind,value){st.chartRanges=st.chartRanges||{};st.chartRanges[kind]=+value;const id=kind==='income'?'incomeGraph':kind==='trends'?'trendsGraph':'cashflowGraph';const el=document.getElementById(id);if(el)el.innerHTML=kind==='income'?incomeExpenseGraph():kind==='trends'?trendsGraph():cashFlowGraph();const lbl=document.getElementById(kind+'RangeLabel');if(lbl)lbl.textContent=selectedChartMonths(kind).length+' months'}
function miniLineChart(series){const W=620,H=183,pad=34,values=series.flatMap(x=>x.values),max=Math.max(1,...values)*1.08,min=Math.min(0,...values),n=Math.max(...series.map(x=>x.values.length)),X=i=>pad+i*(W-pad*2)/Math.max(1,n-1),Y=v=>H-pad-(v-min)/(max-min||1)*(H-pad*1.7);return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-height:225px" role="img" aria-label="Monthly financial trends">${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" x2="${W-pad}" y1="${Y(min+(max-min)*f)}" y2="${Y(min+(max-min)*f)}" stroke="var(--ln)" stroke-width="1"/><text x="2" y="${Y(min+(max-min)*f)+3}" font-size="11" fill="var(--mu)">${$(min+(max-min)*f)}</text>`).join('')}${series.map(x=>`<polyline fill="none" stroke="${x.color}" stroke-width="2.5" stroke-linejoin="round" points="${x.values.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>${x.values.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="2.6" fill="${x.color}"><title>${escHtml((x.months||[])[i]||'')}: ${$(v)}</title></circle>`).join('')}`).join('')}${(series[0]?.months||[]).map((m,i)=>(i%Math.max(1,Math.ceil(n/7))===0||i===n-1)?`<text x="${X(i)}" y="${H-5}" font-size="10" text-anchor="middle" fill="var(--mu)">${m}</text>`:'').join('')}</svg>`}
function chartLegend(items){return `<div class="chart-legend">${items.map(x=>`<span><i style="background:${x.color}"></i>${escHtml(x.name)}</span>`).join('')}</div>`}
function incomeExpenseGraph(){const months=selectedChartMonths('income');return miniLineChart([{values:months.map(m=>T(A(m)).i),months,color:'#47a371'},{values:months.map(m=>T(A(m)).exp),months,color:'#e36a61'}])+chartLegend([{name:'Income',color:'#47a371'},{name:'Expenses',color:'#e36a61'}])}
function incomeExpenseCard(){return `<div class="card"><b>Income and expenses</b><div class="mu">Monthly actuals · spreadsheet values for closed months</div>${chartRangeSlider('income')}<div id="incomeGraph">${incomeExpenseGraph()}</div></div>`}
function configureTrends(){openPanel('Customize Trends',`<p class="mu">Select spending categories to compare by month.</p>${D.c.map((c,i)=>({c,i})).filter(x=>'ad'.includes(x.c[1])).map(x=>`<label style="display:flex;align-items:center;gap:10px;padding:4px"><input type="checkbox" class="trendCheck" value="${x.i}" ${trendIndices().includes(x.i)?'checked':''}>${escHtml(x.c[0])}</label>`).join('')}<button class="p" style="width:100%" onclick="st.trendCats=[...document.querySelectorAll('.trendCheck:checked')].map(x=>+x.value);closePanel();go()">Save categories</button>`)}
function trendIndices(){if(st.trendCats)return st.trendCats;const keys=['grocer','food','dining','drink','gas','fuel'];const inds=[];keys.forEach(k=>{const j=D.c.findIndex((c,i)=>'ad'.includes(c[1])&&c[0].toLowerCase().includes(k));if(j>=0&&!inds.includes(j))inds.push(j)});const worse=D.c.map((c,i)=>({c,i,d:(A(st.m)[i]||0)-(B(st.m)[i]||0)})).filter(x=>'ad'.includes(x.c[1])&&!inds.includes(x.i)).sort((a,b)=>b.d-a.d)[0];if(worse)inds.push(worse.i);return inds}
function trendsGraph(){const months=selectedChartMonths('trends'),selected=trendIndices(),colors=['#4268a1','#e09142','#54a37b','#a572bd','#d87575'];return selected.length?miniLineChart(selected.map((i,j)=>({values:months.map(m=>A(m)[i]||0),months,color:colors[j%colors.length]})))+chartLegend(selected.map((i,j)=>({name:D.c[i][0],color:colors[j%colors.length]}))):'<p class="mu">Select categories to view trends.</p>'}
function trendCard(){return `<div class="card"><div class="action-top"><div><b>Spending trends</b><div class="mu">Groceries, Food/Drink, Gas + worst category</div></div><button class="smallbtn" onclick="configureTrends()">Customize</button></div>${chartRangeSlider('trends')}<div id="trendsGraph">${trendsGraph()}</div></div>`}

function recurringCard(){
 const now=new Date(),cut=new Date(now);cut.setDate(cut.getDate()-190);
 const groups={};
 S.t.filter(t=>!t.pending&&!t.tr&&!t.ig&&!t.cl&&t.d&&new Date(t.d+'T12:00:00')>=cut&&D.c[t.c]&&'ad'.includes(D.c[t.c][1])).forEach(t=>{
  const k=String(t.n||'').toLowerCase().replace(/\d+/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
  if(k.length<3)return;(groups[k]||(groups[k]=[])).push(t);
 });
 const bills=Object.entries(groups).map(([k,rows])=>{
  const uniqueMonths=new Set(rows.map(t=>t.m));if(rows.length<3||uniqueMonths.size<2)return null;
  rows.sort((a,b)=>a.d.localeCompare(b.d));const latest=rows[rows.length-1],prior=rows.slice(0,-1),avg=prior.reduce((s,t)=>s+t.a,0)/(prior.length||1),day=Math.round(rows.reduce((s,t)=>s+(+t.d.slice(8,10)||1),0)/rows.length);
  let due=new Date(now.getFullYear(),now.getMonth(),day);if(due<new Date(now.getFullYear(),now.getMonth(),now.getDate()))due=new Date(now.getFullYear(),now.getMonth()+1,day);
  const days=Math.ceil((due-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
  return {name:latest.n,avg,latest:latest.a,high:prior.length>=2&&latest.a>avg*1.25,due,days};
 }).filter(Boolean).filter(x=>x.days<=14||x.high).sort((a,b)=>(a.high?-1:0)-(b.high?-1:0)||a.days-b.days).slice(0,5);
 if(!bills.length)return `<div class=card><b>Recurring bills</b><div class=mu>Not enough repeat history to estimate upcoming bills yet. Estimates appear after a merchant repeats across multiple months.</div></div>`;
 return `<div class=card><b>Recurring bills</b><div class=mu>Estimated from repeat transactions · confirm dates and amounts</div>${bills.map(x=>`<div class=row><span>${escHtml(x.name)}<br><span class=mu>${x.high?`Higher than usual · average ${$(x.avg)}`:`Estimated due ${x.due.toLocaleDateString('en-US',{month:'short',day:'numeric'})} · ${x.days===0?'today':`in ${x.days} days`}`}</span></span><b style="${x.high?'color:var(--red)':''}">${$(x.latest)}</b></div>`).join('')}</div>`;
}

function reconciliationInfo(m){const bs=balanceSheet(m),acc=effectiveAccounts().filter(x=>S.rowmap?.[x.id]),diffs=[];
 for(const [label,rows,expected] of [['Cash',[66,67,68,69,70,71,72],bs.cash],['Investments',[61,62],bs.investments],['Credit cards',[85],bs.liabilities.filter(x=>/credit/i.test(x.n)).reduce((v,x)=>v+x.v,0)]]){
 const found=acc.filter(x=>rows.includes(+S.rowmap[x.id]));if(!found.length)continue;
 const mapped=found.reduce((v,x)=>v+Math.abs(+x.effective||0),0),diff=mapped-Math.abs(expected||0);
 diffs.push({label,mapped,expected:Math.abs(expected||0),diff,count:found.length});}
 return diffs;
}
function aiInsights(){if(!D)return '';const m=st.m,a=A(m),b=B(m),x=[];D.c.forEach((c,i)=>{if('ad'.includes(c[1])&&b[i]>0&&a[i]>b[i])x.push({name:c[0],delta:a[i]-b[i]})});x.sort((a,b)=>b.delta-a.delta);const due=effectiveAccounts().filter(v=>v.source==='manual'&&v.updated&&Date.now()-Date.parse(v.updated)>15*86400000);const tips=[];if(due.length)tips.push(`Update the manually tracked balance for ${escHtml(due[0].displayName)}.`);if(x.length)tips.push(`Review ${escHtml(x[0].name)}: ${$(x[0].delta)} over this month's budget.`);const n=T(a),p=T(b);if(n.cash<0&&p.s>0)tips.push(`Expected cash flow is negative; consider reducing planned savings or investments before adding debt.`);const bs=balanceSheet(m),mapped=effectiveAccounts(),unmapped=mapped.filter(x=>!S.rowmap?.[x.id]);if(unmapped.length)tips.push(`${unmapped.length} account(s) are not mapped to Main Page; reconcile before closing.`);const mismatches=reconciliationInfo(m).filter(x=>Math.abs(x.diff)>1);if(mismatches.length)tips.push(`${escHtml(mismatches[0].label)} differs by ${$(Math.abs(mismatches[0].diff))} between mapped accounts and Main Page; check mapping, subtotals, and stale balances.`);if(!tips.length)tips.push('Review upcoming bills and reconcile account balances before month close.');return `<div class="card" id="ai-insights"><b>✦ Financial insights</b><div class="mu">Rule-based suggestions from your app data · Budgy can explain further</div><ul style="padding-left:20px">${tips.slice(0,3).map(t=>`<li style="margin:8px 0">${t}</li>`).join('')}</ul><button class="smallbtn" onclick="openBudgy()">Ask Budgy</button></div>`}
let budgyHistory=[];

async function sendBudgy(){const f=document.getElementById('budgyInput'),question=f.value.trim();if(!question)return;f.value='';appendBudgy('user',question);const placeholder=appendBudgy('assistant','Thinking…');const sb=document.getElementById('budgySend');sb.disabled=true;try{const m=st.m,a=A(m),b=B(m),categories=D.c.map((c,i)=>({name:c[0],type:c[1],actual:a[i]||0,budget:b[i]||0})),accountBalances=effectiveAccounts().map(t=>({name:t.displayName,balance:t.effective,kind:accountKind(t),source:t.source,updated:t.updated}));const summary={month:m,closed:!!S.cm?.[m],categories,accounts:accountBalances,subscriptions:S.subscriptions||[],actualCashFlow:cashFlow(m),budgetCashFlowProxy:T(b).cash,reconciliation:reconciliationInfo(m)};const res=await fetch(CFG.u,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({token:CFG.k,action:'budgy',question,history:budgyHistory.slice(-8),summary})});const data=await res.json();if(data.err)throw Error(data.err);placeholder.textContent=data.reply||'No reply received.';budgyHistory.push({role:'user',text:question},{role:'assistant',text:placeholder.textContent});}catch(e){placeholder.textContent='Budgy unavailable: '+e.message+'. Check GEMINI_API_KEY, GEMINI_MODEL, deployment, and API access in Apps Script.'}finally{sb.disabled=false}}

 const ICONS={Dashboard:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',Actuals:'<path d="M8 6h13M8 12h13M8 18h13"/><path d="m2 6 2 2 3-4M2 12l2 2 3-4M2 18l2 2 3-4"/>',Transactions:'<path d="M4 7h16m-4-4 4 4-4 4M20 17H4m4-4-4 4 4 4"/>',Budget:'<rect x="3" y="5" width="18" height="15" rx="2"/><path d="M3 10h18M16 15h2"/>',Forecast:'<path d="M3 17l6-6 4 3 8-9"/><path d="M15 5h6v6"/>'};
 const tabs=['Dashboard','Actuals','Transactions','Budget','Forecast'];
 n.innerHTML=`<div class="tabs">${tabs.map(t=>`<button class="${st.t===t?'on':''}" onclick="st.t='${t}';go()"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[t]}</svg><span>${t==='Dashboard'?'Dash':t==='Transactions'?'Txns':t}</span></button>`).join('')}</div>`;
 syncUi();
 if(!document.getElementById('budgyBubble'))document.body.insertAdjacentHTML('beforeend',`<button id="budgyBubble" aria-label="Ask Budgy" title="Ask Budgy" onclick="openBudgy()">✦</button><div id="budgyPanel" hidden><div class="budgy-head"><b>✦ Ask Budgy</b><button class="smallbtn" onclick="closeBudgy()" aria-label="Close">✕</button></div><div id="budgyMessages" aria-live="polite"><div class="budgy-message assistant">Ask Budgy about your budget, accounts, or spending. I'll suggest actions, but won't change your data.</div></div><form class="budgy-foot" onsubmit="event.preventDefault();sendBudgy()"><input id="budgyInput" autocomplete="off" aria-label="Question for Budgy" placeholder="Ask Budgy…"><button id="budgySend" class="p">Send</button></form></div>`);
}
boot();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
